<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 300px;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    
    h1 {
      font-size: 18px;
      margin: 0 0 16px 0;
      color: #333;
    }
    
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    .slider-label {
      font-size: 14px;
      color: #666;
      display: flex;
      justify-content: space-between;
    }
    
    input[type="range"] {
      width: 100%;
    }
    
    button {
      padding: 8px 16px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    
    #reduceBtn {
      background-color: #2563eb;
      color: white;
    }
    
    #reduceBtn:hover {
      background-color: #1d4ed8;
    }
    
    #reduceBtn:disabled {
      background-color: #93c5fd;
      cursor: not-allowed;
    }
    
    #restoreBtn {
      background-color: #6b7280;
      color: white;
    }
    
    #restoreBtn:hover {
      background-color: #4b5563;
    }
    
    #restoreBtn:disabled {
      background-color: #d1d5db;
      cursor: not-allowed;
    }
    
    .status {
      margin-top: 12px;
      padding: 8px;
      border-radius: 4px;
      font-size: 13px;
      text-align: center;
    }
    
    .status.error {
      background-color: #fee2e2;
      color: #991b1b;
    }
    
    .status.success {
      background-color: #dcfce7;
      color: #166534;
    }
    
    .status.info {
      background-color: #e0e7ff;
      color: #3730a3;
    }
    
    .server-status {
      font-size: 12px;
      color: #666;
      text-align: center;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #e5e7eb;
    }
    
    .server-status.online {
      color: #059669;
    }
    
    .server-status.offline {
      color: #dc2626;
    }
  </style>
</head>
<body>
  <h1>Reduct - Text Reducer</h1>
  
  <div class="controls">
    <div class="slider-container">
      <div class="slider-label">
        <span>Reduction Level</span>
        <span id="reductionValue">50%</span>
      </div>
      <input type="range" id="reductionSlider" min="20" max="80" value="50" step="10">
    </div>
    
    <button id="reduceBtn">Reduce Page</button>
    <button id="restoreBtn" disabled>Restore Original</button>
    
    <div id="status" class="status" style="display: none;"></div>
  </div>
  
  <div id="serverStatus" class="server-status">Checking server...</div>
  
  <script src="popup.js"></script>
</body>
</html>
